name: Deploy to GitHub Pages

# Publishes the repository (static site: the ACEMID tracker at index.html and
# the dermatology journal-club dashboard / reading list / CSV) to GitHub Pages.
#
# SIMPLEST PUBLISH (no workflow needed): Settings → Pages → Source:
#   "Deploy from a branch" → main / (root). Files (incl. .nojekyll) serve as-is
#   and auto-update on every push.
#
# OPTIONAL (this workflow): Settings → Pages → Source: "GitHub Actions", then
# run this manually from the Actions tab ("Run workflow"). Trigger is manual
# only so it never produces a failing run before Pages is configured.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer runs supersede in-progress ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
