name: Deploy to GitHub Pages

# Publishes the repository (static site: the ACEMID tracker at index.html and
# the dermatology journal-club dashboard / reading list / CSV) to GitHub Pages.
#
# ONE-TIME SETUP: in the repo, go to Settings → Pages → "Build and deployment"
# → Source: "GitHub Actions". After that this runs automatically on every push
# to main (and can be run manually from the Actions tab).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer runs supersede in-progress ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
