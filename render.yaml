services:
  - type: web
    name: acd-research-intelligence
    env: python
    region: singapore
    plan: starter
    buildCommand: pip install -r dashboard/requirements.txt
    startCommand: gunicorn dashboard.app:server --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DASH_DEBUG
        value: "false"
    healthCheckPath: /
